name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create excluded sentinel files
        run: |
          printf 'CI-only secret sentinel\n' > .env
          printf 'CI-only database sentinel\n' > careertracker.db

      - name: Build Docker image
        run: docker build --tag careertracker-security-ci .

      - name: Verify image excludes local data and runs as non-root
        run: >-
          docker run --rm --entrypoint sh careertracker-security-ci -c
          'test ! -e /app/.env && test ! -e /app/careertracker.db && test "$(id -u)" -ne 0'

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci_tests.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify optional OCR dependency boundary
        run: |
          python -c "import importlib.util as u; assert u.find_spec('PIL'); assert u.find_spec('rapidocr') is None; assert u.find_spec('onnxruntime') is None"

      - name: Create database tables through migrations
        run: python -m alembic upgrade head

      - name: Check migration and model parity
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and Python audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  ocr-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional OCR dependencies
        run: pip install -e ".[dev,ocr]"
      - name: Run full test suite with OCR dependencies
        run: python -m pytest -q

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careertracker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careertracker -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://careertracker:ci-only-password@localhost:5432/migration_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Bootstrap empty PostgreSQL database
        run: python -m alembic upgrade head
      - name: Check migration and model parity
        run: python -m alembic check
      - name: Roll back disposable database
        run: python -m alembic downgrade base
      - name: Reapply migrations
        run: python -m alembic upgrade head
      - name: Recheck migration and model parity
        run: python -m alembic check

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-compose-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare Compose environment file
        run: cp .env.example .env
      - name: Validate required password and safe defaults
        shell: bash
        run: |
          POSTGRES_PASSWORD=ci-compose-only-password docker compose config --format json > /tmp/compose-config.json
          if grep -q 'careertracker:careertracker@' docker-compose.yml; then
            echo "Weak hard-coded database credentials found in docker-compose.yml"
            exit 1
          fi
          if env -u POSTGRES_PASSWORD docker compose config >/tmp/compose-without-password.yml 2>&1; then
            echo "docker compose config unexpectedly succeeded without POSTGRES_PASSWORD"
            exit 1
          fi
          grep -Eiq '^#[[:space:]]*POSTGRES_PASSWORD=.*placeholder' .env.example
