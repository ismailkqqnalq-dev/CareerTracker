[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careertracker"
version = "0.1.0"
description = "CareerTracker backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
