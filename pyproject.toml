[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careertracker"
version = "0.1.0"
description = "CareerTracker backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.0",
  "PyJWT",
  "pwdlib[argon2]",
  "python-multipart",
  "email-validator",
  "Pillow>=11.3,<14",
]
[project.optional-dependencies]
ocr = [
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "httpx2>=2.13.1,<3"
]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
